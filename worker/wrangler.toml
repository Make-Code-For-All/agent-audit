name = "agent-audit-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Where your scanner page lives (origin only, no path). Separate several with commas.
ALLOWED_ORIGIN = "https://YOUR-NAME.github.io"
# The repository that holds .github/workflows/scan.yml
SCANNER_REPO = "YOUR-NAME/agent-audit"
SCANNER_BRANCH = "main"
WORKFLOW_FILE = "scan.yml"

[[kv_namespaces]]
binding = "SCANS"
id = "PASTE_KV_NAMESPACE_ID_HERE"

# Secrets (set with `npx wrangler secret put NAME`, never written in this file):
#   GITHUB_TOKEN      fine-grained token for the scanner repo, Actions: read and write
#   CALLBACK_SECRET   random string, also saved as an Actions secret in the scanner repo
#   TURNSTILE_SECRET  Cloudflare Turnstile secret key (strongly recommended)
